---
# Recording rules and multi-window multi-burn-rate alerts implementing
# slo/slo.yaml.
#
# Two things here are worth more than the rest of the file.
#
# First, the recording rules exist so that alert expressions stay short enough
# to read at 3am. An alert whose expression is four nested rate() calls is an
# alert nobody can evaluate under pressure.
#
# Second, every alert pairs a long window with a short one. The long window
# establishes that the budget is genuinely burning rather than blipping; the
# short window lets the alert clear promptly once it stops. Single-window
# burn-rate alerts either fire on noise or notice hours late.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: proofline-slo
  labels:
    app.kubernetes.io/name: proofline
    role: slo-rules
spec:
  groups:
    - name: proofline.sli
      interval: 30s
      rules:
        # Error ratio across every window the burn-rate alerts need. Recorded
        # rather than computed inline so each window is evaluated once, not once
        # per alert that references it.
        - record: proofline:sli_errors:ratio_rate5m
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[5m]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[5m]))

        - record: proofline:sli_errors:ratio_rate30m
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[30m]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[30m]))

        - record: proofline:sli_errors:ratio_rate1h
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[1h]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[1h]))

        - record: proofline:sli_errors:ratio_rate2h
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[2h]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[2h]))

        - record: proofline:sli_errors:ratio_rate6h
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[6h]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[6h]))

        - record: proofline:sli_errors:ratio_rate1d
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[1d]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[1d]))

        - record: proofline:sli_errors:ratio_rate3d
          expr: |
            sum(rate(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[3d]))
            /
            sum(rate(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[3d]))

        # Latency SLI: the proportion of requests *slower* than the 250ms
        # objective, expressed as an error ratio so it shares the same
        # burn-rate machinery as availability.
        - record: proofline:sli_latency_errors:ratio_rate1h
          expr: |
            1 - (
              sum(rate(http_request_duration_seconds_bucket{job="proofline",le="0.25",path!~"/healthz|/readyz|/metrics"}[1h]))
              /
              sum(rate(http_request_duration_seconds_count{job="proofline",path!~"/healthz|/readyz|/metrics"}[1h]))
            )

        # The remaining share of the 30-day error budget, for dashboards and
        # for the conversation about whether to ship on a Friday.
        - record: proofline:error_budget_remaining:ratio30d
          expr: |
            1 - (
              (
                sum(increase(http_requests_total{job="proofline",status=~"5..",path!~"/healthz|/readyz|/metrics"}[30d]))
                /
                sum(increase(http_requests_total{job="proofline",path!~"/healthz|/readyz|/metrics"}[30d]))
              ) / 0.005
            )

    - name: proofline.slo.alerts
      rules:
        # 14.4x burn: 2% of a 30-day budget in one hour. If this holds, the
        # month's budget is gone in about two days.
        - alert: ProoflineErrorBudgetBurnFast
          expr: |
            proofline:sli_errors:ratio_rate1h > (14.4 * 0.005)
            and
            proofline:sli_errors:ratio_rate5m > (14.4 * 0.005)
          for: 2m
          labels:
            severity: page
            slo: availability
          annotations:
            summary: proofline is burning its error budget 14.4x too fast
            description: >-
              1h error ratio is {{ $value | humanizePercentage }}, against a
              0.5% objective. At this rate the 30-day budget is exhausted in
              roughly two days.
            runbook_url: https://github.com/YOUR_HANDLE/proofline/blob/main/docs/runbooks/error-budget-burn.md

        - alert: ProoflineErrorBudgetBurnModerate
          expr: |
            proofline:sli_errors:ratio_rate6h > (6 * 0.005)
            and
            proofline:sli_errors:ratio_rate30m > (6 * 0.005)
          for: 15m
          labels:
            severity: page
            slo: availability
          annotations:
            summary: proofline is burning its error budget 6x too fast
            description: >-
              6h error ratio is {{ $value | humanizePercentage }}. 5% of the
              30-day budget has gone in six hours.
            runbook_url: https://github.com/YOUR_HANDLE/proofline/blob/main/docs/runbooks/error-budget-burn.md

        # Slower burns raise a ticket rather than a page. Waking someone for a
        # problem that will still be there in the morning is how on-call rotas
        # stop being answered.
        - alert: ProoflineErrorBudgetBurnSlow
          expr: |
            proofline:sli_errors:ratio_rate1d > (3 * 0.005)
            and
            proofline:sli_errors:ratio_rate2h > (3 * 0.005)
          for: 1h
          labels:
            severity: ticket
            slo: availability
          annotations:
            summary: proofline has consumed 10% of its error budget in a day
            description: 24h error ratio is {{ $value | humanizePercentage }}.
            runbook_url: https://github.com/YOUR_HANDLE/proofline/blob/main/docs/runbooks/error-budget-burn.md

        - alert: ProoflineErrorBudgetBurnTrickle
          expr: |
            proofline:sli_errors:ratio_rate3d > 0.005
            and
            proofline:sli_errors:ratio_rate6h > 0.005
          for: 3h
          labels:
            severity: ticket
            slo: availability
          annotations:
            summary: proofline is on track to exhaust its error budget
            description: >-
              The 3-day error ratio exceeds the objective. Nothing is on fire,
              but the budget will not last the month.

        - alert: ProoflineLatencyBudgetBurn
          expr: proofline:sli_latency_errors:ratio_rate1h > (14.4 * 0.01)
          for: 5m
          labels:
            severity: page
            slo: latency
          annotations:
            summary: proofline is burning its latency budget 14.4x too fast
            description: >-
              {{ $value | humanizePercentage }} of requests are slower than the
              250ms objective over the last hour.

        # Not an SLO alert, but the one that catches the failure the SLO alerts
        # structurally cannot: if nothing is scraping, every ratio above is
        # NaN and every alert stays silent. Absent metrics look identical to
        # perfect health.
        - alert: ProoflineNoMetrics
          expr: absent(up{job="proofline"} == 1)
          for: 5m
          labels:
            severity: page
          annotations:
            summary: no proofline instance is being scraped
            description: >-
              Every SLO alert depends on these metrics existing. With no
              targets up, silence means blindness rather than health.
