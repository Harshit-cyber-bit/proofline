---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: proofline
  labels:
    app.kubernetes.io/name: proofline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: proofline
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      # Slow to scale down. Shedding capacity quickly after a traffic spike is
      # how you turn one spike into two incidents.
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
