---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: proofline-dev

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/instance: dev

patches:
  - path: replicas.yaml
    target:
      kind: Deployment
      name: proofline
  # Fixed NodePort 30080, mapped to the host by the kind config, so the prober
  # reaches the Service through kube-proxy rather than a single-pod tunnel.
  - path: service-nodeport.yaml
    target:
      kind: Service
      name: proofline
