---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proofline
spec:
  # Each of these drops requests.
  strategy:
    rollingUpdate:
      # 100%: every pod may go down at once. This is what people reach for when
      # they want "faster deploys" and have not thought about what unavailable
      # means.
      #
      # Two weaker settings were tried here first and are worth knowing about:
      #
      #   25% (the Kubernetes default) -- rounds DOWN for maxUnavailable, so at
      #   two replicas it is 0 and the default is accidentally safe. It only
      #   starts dropping traffic at four or more replicas.
      #
      #   1 -- takes one of two pods down, so the survivor keeps serving and
      #   only in-flight requests to the dying pod fail. Real, but small: about
      #   one dropped request in eighty. Enough to fail the build (zero means
      #   zero) and too subtle to see in a demo.
      maxUnavailable: 100%
      # maxSurge: 0 is what turns this from "a few dropped requests" into a
      # real outage. With any surge allowed, the controller prefers to add a new
      # pod before removing old ones, so even maxUnavailable: 100% only dropped
      # 2 requests in 97 -- a genuine failure, but an invisible one. Zero surge
      # forces terminate-then-create: every pod dies, and nothing serves until a
      # replacement passes its (60-second) readiness check.
      #
      # People really do set this, usually to fit inside a tight ResourceQuota.
      maxSurge: 0
  # No soak before a pod counts as available.
  minReadySeconds: 0
  template:
    spec:
      # Too short for the app to finish draining, so the kubelet SIGKILLs it
      # part-way through.
      terminationGracePeriodSeconds: 5
      containers:
        - name: app
          # No drain at all: exit immediately on SIGTERM.
          env:
            - name: APP_DRAIN_SECONDS
              value: "0"
          # No preStop hook, so the pod stops answering before the proxies have
          # been told to stop sending. This one omission is the single most
          # common cause of connection-refused errors during an otherwise
          # correct rolling update.
          lifecycle: null
          # Readiness checked once a minute, so a draining pod stays in the
          # endpoint list long after it stopped serving.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 60
            failureThreshold: 3
