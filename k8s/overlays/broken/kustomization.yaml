---
# The same service with the zero-downtime settings removed.
#
# This overlay exists so the prober can be shown catching something. A check
# that has never failed in front of anyone is indistinguishable from a check
# that cannot fail, and "we have a zero-downtime test" is worth exactly as much
# as the last time somebody watched it go red.
#
# Deployed to the dev namespace by `make break`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: proofline-dev

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/instance: dev

patches:
  - path: remove-safety.yaml
    target:
      kind: Deployment
      name: proofline
