name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: prober and gate (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pytest ruff
      - name: Lint
        run: ruff check prober slo hack app
      - name: Unit tests
        run: pytest prober/tests slo/tests -q

  manifests:
    name: kubernetes and terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install pyyaml jsonschema python-hcl2

      # Strict validation against the upstream Kubernetes JSON schemas. Catches
      # the misplaced-field class of bug that `kubectl apply --dry-run=client`
      # accepts silently.
      - name: Validate manifests, overlays and Terraform
        run: python3 hack/validate.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: terraform validate (local)
        run: |
          cd terraform/local
          terraform init -backend=false -input=false
          terraform validate

      - name: terraform validate (aws)
        run: |
          cd terraform/aws
          terraform init -backend=false -input=false
          terraform validate

  ansible:
    name: ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install ansible-core ansible-lint

      # The production profile, not the default. Anything less does not check
      # the things that make a playbook safe to run against a live fleet.
      - name: ansible-lint
        run: |
          cd ansible
          ansible-lint site.yml roles/

      - name: syntax check
        run: |
          cd ansible
          ansible-playbook site.yml --syntax-check -i localhost,

  kustomize:
    name: overlays build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin

      # Every overlay must actually build. A patch that targets nothing is
      # accepted silently by kustomize in some versions and dropped in others,
      # so building each one is the only way to know they apply.
      - name: Build every overlay
        run: |
          for overlay in k8s/overlays/*/; do
            echo "== $overlay"
            kustomize build "$overlay" > /dev/null
          done

  image:
    name: application image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: proofline/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck hack/*.sh

  prove:
    name: end-to-end proof (kind)
    runs-on: ubuntu-latest
    needs: [python, manifests, kustomize, image]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: proofline
          node_image: kindest/node:v1.31.0

      - name: Install kustomize
        run: |
          curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin

      - name: Build and load the image
        run: |
          docker build -t proofline/app:ci ./app
          kind load docker-image proofline/app:ci --name proofline

      - name: Deploy
        run: |
          kubectl create namespace proofline-dev
          cd k8s/overlays/dev && kustomize edit set image proofline/app=proofline/app:ci && cd -
          kubectl apply -k k8s/overlays/dev
          kubectl rollout status deployment/proofline -n proofline-dev --timeout=300s

      # The claim, tested on every push: roll the deployment while probing, and
      # fail the build if a single request is dropped.
      - name: Prove the rollout drops nothing
        run: |
          kubectl set env deployment/proofline -n proofline-dev ROLLOUT_TRIGGER=$(date +%s)
          ./hack/probe-rollout.sh kind-proofline proofline-dev 18080 reports/ci/probe.json

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-reports
          path: reports/
          if-no-files-found: ignore
