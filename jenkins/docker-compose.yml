---
# Jenkins for the local demo, configured entirely from code.
#
# The controller is disposable on purpose: everything about it -- plugins,
# credentials scaffolding, the job itself -- comes from casc.yaml and
# plugins.txt. A Jenkins you configured by clicking is a Jenkins nobody can
# rebuild, and rebuilding it is exactly what happens after it breaks.
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proofline-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      CASC_JENKINS_CONFIG: /var/jenkins_home/casc.yaml
      JENKINS_ADMIN_PASSWORD: proofline

      # Set here rather than only in the Jenkinsfile, because otherwise every
      # process that is not a pipeline run -- `docker exec ... kubectl`, a shell
      # in the container, anything you reach for while debugging -- has no
      # kubeconfig at all.
      #
      # And kubectl's behaviour with no kubeconfig is genuinely hostile: it
      # falls back to its legacy default of http://localhost:8080. Inside this
      # container port 8080 is Jenkins. So `kubectl get nodes` queries Jenkins,
      # Jenkins answers with an HTML login page, and kubectl reports
      # "couldn't get current server API group list" followed by a wall of
      # markup. Nothing in that error suggests a missing kubeconfig, and the
      # cluster it appears to be failing to reach is perfectly healthy.
      KUBECONFIG: /var/jenkins_home/.kube/config
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./casc.yaml:/var/jenkins_home/casc.yaml:ro
      # The agent builds images and talks to kind, so it needs the host's
      # Docker socket and kubeconfig. Fine for a laptop demo; not a pattern to
      # copy into a shared controller, where it hands every job root on the host.
      - /var/run/docker.sock:/var/run/docker.sock
      # NOT ${HOME}/.kube. kind writes a kubeconfig pointing at 127.0.0.1 and a
      # published host port; inside this container 127.0.0.1 is this container,
      # so every kubectl call fails to connect and the error names a port that
      # is demonstrably open on the host. `make jenkins` writes the --internal
      # form here instead, which addresses the control plane by container name
      # on the kind network -- where this container also lives.
      - ./.kubeconfig-internal:/var/jenkins_home/.kube/config:ro
    networks:
      - kind

volumes:
  jenkins_home:

networks:
  kind:
    external: true
