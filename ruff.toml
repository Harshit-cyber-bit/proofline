# Explicit ruleset rather than defaults, so a ruff upgrade cannot silently
# change what CI enforces.
line-length = 88
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8 naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff's own rules
]

[lint.per-file-ignores]
# The prober, the gate and the validator all deliberately manipulate sys.path
# before importing their siblings, so that each runs as a standalone script on
# a CI agent with nothing installed. That requires imports after code.
"prober/prober.py" = ["E402"]
"prober/tests/*" = ["E402"]
"slo/tests/*" = ["E402"]
"hack/validate.py" = ["E402"]
