---
- name: Configure the application fleet
  # Not `all`. The Docker inventory returns every container on the machine --
  # the kind nodes, the registry, Jenkins -- and `all` would configure them.
  # Selection lives here rather than in the inventory's filters option, which
  # is not a Docker label filter; see ansible/inventory/docker.yml.
  hosts: proofline-app-*
  become: true
  gather_facts: true

  # One host at a time. Configuration management across a serving fleet is a
  # rolling change like any other: taking every host at once is how a bad
  # playbook becomes an outage instead of one failed host.
  serial: 1
  max_fail_percentage: 0

  roles:
    - role: baseline
      tags: [baseline]
    - role: node_exporter
      tags: [monitoring]
    - role: app_runtime
      tags: [app]
