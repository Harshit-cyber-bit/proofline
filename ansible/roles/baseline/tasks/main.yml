---
# Baseline configuration every host in the fleet gets, regardless of role.
# Written to be idempotent: running it twice must change nothing the second
# time, which the CI check asserts by running it twice and diffing the counts.

# Without this, the first task of the first run fails with "No package matching
# 'curl' is available" -- which reads like the package does not exist, when in
# fact the host has never fetched a package list. Container base images clear
# /var/lib/apt/lists to stay small, and a freshly provisioned cloud instance is
# in the same state.
#
# ansible.builtin.package cannot do this: refreshing a cache is package-manager
# specific and the generic module deliberately has no option for it. So this is
# split by ansible_facts['pkg_mgr'], which is also what makes the role work on
# both the Debian-family fleet and an RPM host.
#
# changed_when: false because fetching a package list is not a change to the
# host's configuration. Left as-is it would report changed on every run and the
# idempotence check -- the one thing this role's CI actually asserts -- would
# fail forever on a task that had done nothing.
- name: Refresh the package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['pkg_mgr'] == 'apt'
  changed_when: false
  register: baseline_apt_cache
  retries: 3
  delay: 5
  until: baseline_apt_cache is succeeded

- name: Refresh the package cache (dnf/yum)
  ansible.builtin.dnf:
    update_cache: true
  when: ansible_facts['pkg_mgr'] in ['dnf', 'dnf5', 'yum']
  changed_when: false
  register: baseline_dnf_cache
  retries: 3
  delay: 5
  until: baseline_dnf_cache is succeeded

- name: Ensure baseline packages are present
  ansible.builtin.package:
    name: "{{ baseline_packages }}"
    state: present
  register: baseline_packages_result
  retries: 3
  delay: 5
  until: baseline_packages_result is succeeded

# Done with builtin modules rather than community.general.timezone, so the whole
# playbook runs on a bare ansible-core install. The only collection this repo
# needs is community.docker, and only for the local inventory -- not for any task.
- name: Set the system timezone
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ timezone }}"
    dest: /etc/localtime
    state: link
    force: true

- name: Ensure the application group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
    system: true

- name: Ensure the application user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    home: "{{ app_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Create the application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_home }}"
    - "{{ app_home }}/bin"
    - "{{ app_home }}/etc"
    - /var/log/proofline

- name: Configure log rotation
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/proofline
    owner: root
    group: root
    mode: "0644"

- name: Record what configured this host and when
  ansible.builtin.template:
    src: release.j2
    dest: "{{ app_home }}/etc/release"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
