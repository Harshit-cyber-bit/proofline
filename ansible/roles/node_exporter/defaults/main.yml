---
node_exporter_user: node_exporter
node_exporter_install_dir: /usr/local/bin
node_exporter_arch: amd64

# Composed here rather than inline in the task. A folded YAML scalar would keep
# the line short and quietly insert spaces into the URL; building it from parts
# keeps every line readable and the result correct.
node_exporter_base_url: https://github.com/prometheus/node_exporter/releases/download
node_exporter_archive: "node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}"
node_exporter_url: "{{ node_exporter_base_url }}/v{{ node_exporter_version }}/{{ node_exporter_archive }}.tar.gz"
