---
# node_exporter, so the fleet appears in the same Prometheus the Kubernetes
# workloads report to. A monitoring stack that only sees half the estate is how
# an incident becomes a mystery.

- name: Ensure the node_exporter user exists
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present

- name: Check whether the desired node_exporter version is already installed
  ansible.builtin.command: "{{ node_exporter_install_dir }}/node_exporter --version"
  register: node_exporter_installed
  changed_when: false
  failed_when: false

- name: Download and unpack node_exporter
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /tmp
    remote_src: true
    owner: root
    group: root
  # Only when the running version differs. Re-downloading on every play is the
  # difference between a two-second run and a two-minute one across a fleet.
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))
  notify: Restart node_exporter

- name: Install the node_exporter binary
  ansible.builtin.copy:
    src: "/tmp/{{ node_exporter_archive }}/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: node_exporter_version not in (node_exporter_installed.stdout | default(''))
  notify: Restart node_exporter

- name: Install the node_exporter unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd_service:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
