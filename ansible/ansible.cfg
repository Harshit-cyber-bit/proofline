[defaults]
inventory              = inventory/
roles_path             = roles
host_key_checking      = False
# `stdout_callback = yaml` is the usual way to get readable output, and it is
# wrong here: that callback lives in community.general, which this repo
# deliberately does not depend on. With ansible-core alone it fails at the end
# of the run with "Could not load 'yaml' callback plugin" -- after the play, so
# it looks like a failure of the playbook rather than of the config.
#
# ansible-core 2.13 and later render YAML natively instead. Same output, no
# collection.
stdout_callback        = default
result_format          = yaml
bin_ansible_callbacks  = True
interpreter_python     = auto_silent
# Fail the whole run if any host fails, rather than limping on with a partly
# configured fleet. A half-configured host is worse than an unconfigured one,
# because it looks finished.
any_errors_fatal       = True
force_handlers         = False

[ssh_connection]
pipelining = True
