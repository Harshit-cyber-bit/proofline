[defaults]
inventory              = inventory/
roles_path             = roles
host_key_checking      = False
stdout_callback        = yaml
bin_ansible_callbacks  = True
interpreter_python     = auto_silent
# Fail the whole run if any host fails, rather than limping on with a partly
# configured fleet. A half-configured host is worse than an unconfigured one,
# because it looks finished.
any_errors_fatal       = True
force_handlers         = False

[ssh_connection]
pipelining = True
